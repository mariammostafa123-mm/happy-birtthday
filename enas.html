<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      color: #333;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 35px 25px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(255, 75, 114, 0.2);
      animation: fadeIn 0.8s ease-in-out;
    }
    .balloons {
      font-size: 2.2rem;
      margin-bottom: 10px;
      animation: bounce 2s infinite ease-in-out;
    }
    .title {
      font-size: 2.4rem;
      color: #ff4b72;
      font-weight: 800;
      margin-bottom: 20px;
      font-family: 'Arial', sans-serif;
      letter-spacing: 1px;
    }
    .photo-container {
      width: 170px;
      height: 170px;
      margin: 0 auto 25px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #ff4b72;
      box-shadow: 0 8px 20px rgba(255, 75, 114, 0.3);
    }
    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .message-btn {
      background: linear-gradient(45deg, #ff4b72, #ff758c);
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 75, 114, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .message-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 75, 114, 0.6);
    }
    .message-box {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #fff0f3;
      border-radius: 16px;
      border-right: 5px solid #ff4b72;
      font-size: 1.1rem;
      line-height: 1.8;
      color: #4a4a4a;
      text-align: right;
      animation: slideDown 0.5s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="balloons">🎈 🎉 🎂 🎉 🎈</div>
    <h1 class="title">Happy Birthday! ✨</h1>
    
    <div class="photo-container">
      <!-- استبدلي photo.jpg باسم ملف صورتها أو رابط مباشر للصورة -->
      <img src="photo.jpg" alt="صورة صديقتي">
    </div>

    <button class="message-btn" onclick="toggleMessage()">افتحي المفاجأة 💌</button>

    <div class="message-box" id="secretMessage">
      <!-- اكتبي الكلام الخاص بكِ هنا -->
      كل سنه وأنتِ طيبة وبخير وجنبي علي طول جايه متأخر بس جيتي علي بالي قولت اعملهالك دلوقتي 
      عايزاكي تعرفي أنك غاليه عندي وان بحبك ❤️
    </div>
  </div>

  <script>
    function toggleMessage() {
      const msg = document.getElementById('secretMessage');
      if (msg.style.display === 'block') {
        msg.style.display = 'none';
      } else {
        msg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
